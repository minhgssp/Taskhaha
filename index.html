<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- PWA Tags -->
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#242568">

    <title>TaskHaha</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              'bg-main': '#F9F8FD',
              'surface': '#FFFFFF',
              'primary-text': '#242568',
              'secondary-text': '#8A8A8E',
              'accent': '#4339F2',
              'accent-dark': '#242568',
              'divider': '#EAEAEA',
              // Card Colors
              'card-green-bg': '#E4F8E9',
              'card-purple-bg': '#E8E7FC',
              'card-orange-bg': '#FFF1E5',
              'card-blue-bg': '#E0F2FE', // New color for 'Life' collection tasks
              'card-red-bg': '#FECACA',
              'card-yellow-bg': '#FDE68A',
              'card-teal-bg': '#99F6E4',
              'card-pink-bg': '#FBCFE8',
              'progress-orange': '#FF9D42',
            },
          }
        }
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.27.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "next/": "https://aistudiocdn.com/next@^16.0.3/",
    "@vercel/kv": "https://aistudiocdn.com/@vercel/kv@^3.0.0",
    "@vercel/node": "https://aistudiocdn.com/@vercel/node@^5.5.6"
  }
}
</script>
</head>
  <body class="bg-bg-main">
    <div id="root"></div>
    <script>
      // Service Worker based loader to handle on-the-fly TSX/TS transpilation
      (async () => {
        if ('serviceWorker' in navigator) {
          try {
            // Register the service worker
            await navigator.serviceWorker.register('/sw.js');

            const loadMainScript = () => {
              // Ensure we don't load the script multiple times
              if (document.querySelector('script[src="/index.tsx"]')) return;
              
              console.log('Service Worker is controlling the page. Loading main script.');
              const script = document.createElement('script');
              script.type = 'module';
              script.src = '/index.tsx'; // The SW will now intercept this request
              document.body.appendChild(script);
            };

            // Check if a service worker is already controlling the page.
            if (navigator.serviceWorker.controller) {
              loadMainScript();
            } else {
              // If not, wait for the 'controllerchange' event.
              // This fires when the service worker has successfully taken control.
              navigator.serviceWorker.addEventListener('controllerchange', () => {
                loadMainScript();
              });
            }
          } catch (error) {
            console.error('Service Worker registration failed:', error);
            document.getElementById('root').innerHTML = 'Failed to load application assets. Please try refreshing.';
          }
        } else {
          document.getElementById('root').innerHTML = 'Service Workers are not supported in this browser. The application cannot run.';
        }
      })();
    </script>
  </body>
</html>
